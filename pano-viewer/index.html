<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全景编辑器 Pro</title>
  <link rel="stylesheet" href="style.css?v=2.0">
  <link rel="stylesheet" href="hotspot.css?v=2.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="专业的全景图查看和编辑工具">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="top-nav">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      <h1>全景编辑器</h1>
    </div>
    <div class="nav-actions">
      <div id="topControls" class="top-controls">
        <!-- 高频操作置前：热点开关、添加热点、小地图 -->
        <button class="top-control-btn" id="topToggleHotspotsBtn" title="显示/隐藏热点">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
        <button class="top-control-btn" id="topAddHotspotBtn" title="添加热点">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5c.55 0 1 .45 1 1v5h5c.55 0 1 .45 1 1s-.45 1-1 1h-5v5c0 .55-.45 1-1 1s-1-.45-1-1v-5H6c-.55 0-1-.45-1-1s.45-1 1-1h5V6c0-.55.45-1 1-1z"/></svg>
        </button>
        <button class="top-control-btn" id="topMinimapBtn" title="场景小地图">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6l7-3 7 3v12l-7 3-7-3V6zm7 0l-5 2.14v7.72L11 18l5-2.14V8.14L11 6z"/></svg>
        </button>
        <span class="top-controls-sep" aria-hidden="true"></span>
        <!-- 查看控制：自动旋转、全屏、指南针、陀螺仪 -->
        <button class="top-control-btn" id="topAutoRotateBtn" title="自动旋转">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V8c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l1.74.98A7.966 7.966 0 0 0 20 13c0-3.04-1.72-5.67-4.35-6.65z"/></svg>
        </button>
        <button class="top-control-btn" id="topFullscreenBtn" title="全屏">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 7h4V5H5v6h2V7zm10 10h-4v2h6v-6h-2v4zM7 17H5v6h6v-2H7v-4zm10-10h2V1h-6v2h4v4z"/></svg>
        </button>
        <button class="top-control-btn" id="topCompassBtn" title="指南针">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm3.5 6.5l-7 3 3 7 4-10z"/></svg>
        </button>
        <button class="top-control-btn" id="topGyroBtn" title="陀螺仪">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4a8 8 0 100 16 8 8 0 000-16zm1 13h-2v-2H9v-2h2V9h2v2h2v2h-2v2z"/></svg>
        </button>
        <span class="top-controls-sep" aria-hidden="true"></span>
        <!-- 编辑扩展：文字、音乐、设置 -->
        <button class="top-control-btn" id="topAddTextBtn" title="添加文字">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 7h16v2H13v10h-2V9H4z"/></svg>
        </button>
        <button class="top-control-btn" id="topAddMusicBtn" title="添加音乐">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        </button>
        <button class="top-control-btn" id="topSettingsBtn" title="设置">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.14 4a6.14 6.14 0 01-.15 1.36l2.05 1.6-1.9 3.29-2.43-1a6.3 6.3 0 01-2.35 1.36l-.37 2.6h-3.8l-.37-2.6a6.3 6.3 0 01-2.35-1.36l-2.43 1-1.9-3.29 2.05-1.6A6.14 6.14 0 013.86 12a6.14 6.14 0 01.15-1.36L2 9.04 3.9 5.75l2.43 1A6.3 6.3 0 018.68 5.4l.37-2.6h3.8l.37 2.6a6.3 6.3 0 012.35 1.36l2.43-1 1.9 3.29-2.05 1.6c.1.44.15.9.15 1.36z"/></svg>
        </button>
      </div>
      <div class="top-right-actions">
        <button class="top-control-pill" id="goHomeBtn" title="首页">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
          首页
        </button>
        <button class="top-control-pill primary" id="saveBtn" title="保存">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17 3H7a2 2 0 00-2 2v14l7-3 7 3V5a2 2 0 00-2-2zm-2 9H9V8h6v4z"/></svg>
          保存
        </button>
      </div>
    </div>
  </header>

  <!-- 主容器 -->
  <div class="main-container">
    
    <!-- 左侧场景列表 (默认收起) -->
    <aside class="sidebar collapsed" id="sidebar">
      <div class="sidebar-header">
        <h2>场景列表</h2>
        <button class="btn-icon" id="addSceneBtn" title="添加场景">
          <span>➕</span>
        </button>
      </div>
      
      <!-- 上传区域 -->
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*,.exr,.hdr" multiple style="display: none;">
        <div class="upload-content">
          <div class="upload-icon">📁</div>
          <p class="upload-text">点击或拖拽上传全景图</p>
          <p class="upload-hint">支持 JPG、PNG、EXR、HDR<br>建议分辨率：4096x2048 及以上</p>
        </div>
      </div>

      <!-- 场景列表容器 -->
      <div class="scene-list" id="sceneList">
        <div class="empty-state">
          <p>暂无场景</p>
          <p class="hint">上传全景图开始创建</p>
        </div>
      </div>
      <div class="sidebar-resizer" id="sidebarResizer"></div>
    </aside>

    <div id="sidebarToggle" class="sidebar-toggle" title="展开/收起侧栏">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </div>

    <!-- 中间全景查看器 -->
    <main class="viewer-container">
      <div id="pano" class="pano-viewer"></div>
      
      <!-- 空状态提示 -->
      <div class="empty-viewer" id="emptyViewer">
        <div class="empty-content">
          <div class="empty-icon">🌍</div>
          <h2>开始创建您的全景作品</h2>
          <p>上传全景图片，创建沉浸式体验</p>
          <button class="btn btn-large btn-primary" id="uploadTrigger">
            <span class="icon">⬆️</span> 上传全景图
          </button>
        </div>
      </div>

      <!-- 底部控制栏 -->
      <div class="control-bar-container">
        <!-- 场景标题遮罩 (移动到底部左侧) -->
        <div class="scene-title-overlay" id="sceneTitleOverlay">
          <h2 id="overlaySceneName">场景名称</h2>
          <p id="overlaySceneCount">1 / 1</p>
        </div>

        <div class="control-bar" id="controlBar" style="display: none;">
          <!-- 隐藏的音频元素 -->
          <audio id="bgMusic" loop style="display: none;"></audio>
          
        
        <div class="control-group scene-info">
          <button class="control-btn" id="prevSceneBtn" title="上一张">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <div id="thumbCarousel" class="thumb-carousel">
            <div id="thumbList" class="thumb-list"></div>
            <div id="thumbScrollBar" class="thumb-scrollbar"><div class="thumb-scrollbar-thumb"></div></div>
          </div>
          <button id="thumbToggleBtn" class="thumb-toggle" title="隐藏缩略图"></button>
          <button class="control-btn" id="nextSceneBtn" title="下一张">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
        </div>

        <div class="control-group" style="display: none;">
          <button class="control-btn" id="bottomAddHotspotBtn" title="添加热点">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
          </button>
          <button class="control-btn" id="bottomAddMusicBtn" title="添加音乐">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
          </button>
          <button class="control-btn" id="bottomAddTextBtn" title="添加文字">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"/></svg>
          </button>
          <button class="control-btn" id="bottomScreenshotBtn" title="截图">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          </button>
          <button class="control-btn" id="toggleHotspotsBtn" title="显示/隐藏热点">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
          <button class="control-btn" id="minimapBtn" title="场景小地图">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
          </button>
          <button class="control-btn" id="settingsBtn" title="设置">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L5.09 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0.43-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </button>
        </div>
      </div>
      <div id="sceneDock" class="scene-dock hidden"></div>
      <div id="sceneDockToggle" class="scene-dock-toggle" title="显示/隐藏场景预览">▲</div>
    </main>

    <!-- 右侧属性面板 -->
    <aside class="properties-panel" id="propertiesPanel">
      <div class="panel-header">
        <h3>属性</h3>
        <button class="btn-icon" id="closePanelBtn">✕</button>
      </div>
      
      <div class="panel-content">
        <div class="property-section">
          <h4>场景设置</h4>
          <div class="property-item">
            <label>场景名称</label>
            <input type="text" id="sceneNameInput" class="input" placeholder="输入场景名称">
          </div>
          <div class="property-item">
            <label>初始视角</label>
            <div class="property-row">
              <input type="number" id="yawInput" class="input-small" placeholder="水平角">
              <input type="number" id="pitchInput" class="input-small" placeholder="俯仰角">
            </div>
          </div>
          <div class="property-item">
            <label>曝光</label>
            <input type="range" id="exposureInput" min="0.2" max="4" step="0.1" value="1">
          </div>
          <div class="property-item">
            <label>色调映射</label>
            <select id="toneMappingSelect" class="input">
              <option value="ACES">ACES Filmic</option>
              <option value="Reinhard">Reinhard</option>
              <option value="Linear">Linear</option>
            </select>
          </div>
          <div class="property-item">
            <button class="btn" id="resetHDRBtn">重置HDR设置</button>
          </div>
        </div>

        <div class="property-section">
          <h4>热点管理</h4>
          <div id="hotspotList" class="hotspot-list">
            <p class="hint">暂无热点，点击"添加热点"创建</p>
          </div>
        </div>
      </div>
      <div class="panel-resizer" id="panelResizer"></div>
    </aside>
  </div>

  <!-- 加载提示 -->
  <div class="loading-overlay" id="loadingOverlay" style="display: none;">
    <div class="loading-content">
      <div class="spinner"></div>
      <p id="loadingText">处理中...</p>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- 热点创建模态框 -->
  <div class="modal" id="hotspotModal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>创建热点</h3>
        <button class="btn-icon" id="closeModalBtn">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>热点类型</label>
          <select id="hotspotType" class="input">
            <option value="info">信息热点</option>
            <option value="link">场景链接</option>
            <option value="image">图片热点</option>
            <option value="arrow">箭头路径</option>
          </select>
        </div>
        <div class="form-group">
          <label>热点标题</label>
          <input type="text" id="hotspotTitle" class="input" placeholder="输入标题">
        </div>
        <div class="form-group" id="hotspotContentGroup">
          <label>热点内容</label>
          <textarea id="hotspotContent" class="input textarea" placeholder="输入内容"></textarea>
        </div>
        <div class="form-group" id="hotspotLinkGroup" style="display: none;">
          <label>链接到场景</label>
          <select id="hotspotLinkScene" class="input">
            <option value="">选择场景</option>
          </select>
        </div>
        <div class="form-group" id="hotspotArrowTargetGroup" style="display: none;">
          <label>箭头目标视角</label>
          <div style="display:flex;gap:8px;">
            <input type="number" step="0.001" id="hotspotArrowTargetYaw" class="input-small" placeholder="yaw(弧度)">
            <input type="number" step="0.001" id="hotspotArrowTargetPitch" class="input-small" placeholder="pitch(弧度)">
            <input type="number" step="0.001" id="hotspotArrowTargetFov" class="input-small" placeholder="fov(弧度)">
          </div>
          <button class="btn" id="recordArrowTargetBtn" style="margin-top:8px;">记录当前视角为目标</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelHotspotBtn">取消</button>
        <button class="btn btn-primary" id="confirmHotspotBtn">确定</button>
      </div>
    </div>
  </div>


  <!-- 场景小地图 -->
  <div id="minimap" class="minimap" style="display: none;"></div>

  

  <!-- Marzipano 库 -->
  <script src="marzipano.js?v=2.0"></script>
  
  <!-- API 客户端 (Web 服务端模式) -->
  <script src="api-client.js?v=2.0"></script>
  
  <!-- EXR 支持库 -->
  <script src="libs/three.min.js"></script>
  <script src="exr-decoder.js?v=2.1"></script>

  <!-- 主应用 -->
  <script src="page-viewer.js?v=2.0"></script>
  <script src="mock-electron.js?v=2.0"></script>
  <script src="app-main.js?v=2.0"></script>
</body>
</html>
